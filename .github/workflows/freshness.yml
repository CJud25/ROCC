name: Freshness

on:
  schedule:
    - cron: "47 9 2 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-demo-date:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The checker imports only stdlib-backed constants, so no dependency install is needed.
      - name: Check demo-data freshness
        run: python scripts/check_freshness.py
